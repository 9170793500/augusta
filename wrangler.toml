# Cloudflare Workers static deploy (build runs: npx wrangler deploy)
name = "augusta"
compatibility_date = "2026-09-24"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "agaoa.com"
zone_name = "agaoa.com"

[[routes]]
pattern = "*.agaoa.com/*"
zone_name = "agaoa.com"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
