# Cloudflare: build (npm run build) then npx wrangler deploy
name = "augusta"
main = "worker/index.ts"
compatibility_date = "2026-09-24"
workers_dev = false
preview_urls = false

# Custom domains (Cloudflare manages DNS + SSL for agaoa.com zone)
[[routes]]
pattern = "agaoa.com"
custom_domain = true

[[routes]]
pattern = "www.agaoa.com"
custom_domain = true

# Set in Dashboard → Workers → augusta → Settings → Variables (plaintext):
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/supabase-config"]
