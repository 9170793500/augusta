# Deploy MUST be: npm run build && npx wrangler deploy
# (Workers Builds: Build command = npm run build, Deploy command = npx wrangler deploy)
# Do NOT use "static assets only" — login needs the Worker for /api/supabase-config
name = "augusta"
main = "worker/index.ts"
compatibility_date = "2026-09-24"
workers_dev = false
preview_urls = false

[build]
command = "npm run build"

# Custom domains (Cloudflare manages DNS + SSL for agaoa.com zone)
[[routes]]
pattern = "agaoa.com"
custom_domain = true

[[routes]]
pattern = "www.agaoa.com"
custom_domain = true

# Variables (IMPORTANT — stay on Worker, not lost on code push):
# Dashboard → Workers & Pages → augusta → Settings → Variables → Production
# Add plaintext: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (same as local .env)
# Optional duplicate: also add as *Build* variables so Vite embed + supabase-config.json in dist

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/supabase-config", "/supabase-config.json", "/api/health"]
