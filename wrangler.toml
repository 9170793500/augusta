# Cloudflare: build (npm run build) then npx wrangler deploy
name = "augusta"
main = "worker/index.ts"
compatibility_date = "2026-09-24"
workers_dev = false
preview_urls = false

# Custom domains (Cloudflare manages DNS + SSL for agaoa.com zone)
[[routes]]
pattern = "agaoa.com"
custom_domain = true

[[routes]]
pattern = "www.agaoa.com"
custom_domain = true

# Production login needs Supabase URL + anon key in BOTH places when using Workers Builds:
# 1) Build → Settings → Environment variables (Build): VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#    (npm build writes dist/supabase-config.json from these)
# 2) Worker → Settings → Variables (runtime): same names for /api/supabase-config fallback

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/supabase-config"]
