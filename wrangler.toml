# Cloudflare Workers static deploy (build runs: npx wrangler deploy)
name = "augusta"
compatibility_date = "2026-09-24"
workers_dev = false
preview_urls = false

# Custom domains (Cloudflare manages DNS + SSL for agaoa.com zone)
[[routes]]
pattern = "agaoa.com"
custom_domain = true

[[routes]]
pattern = "www.agaoa.com"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
